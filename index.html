<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p>Adicionar novo livro:</p>
    <button id="add-book-btn">Adicionar</button>
    <table>
        <thead>
            <tr>
                <th>id</th>
                <th>Name</th>
                <th>Autor</th>
                <th>Número de Páginas</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <dialog id="add-book-dialog">
        <form id="myForm" method="dialog">
            <label for="bookName">Título</label>
            <input type="text" id="bookName" name="bookName" placeholder="Título" required>
            <label for="author">Autor</label>
            <input type="text" id="author" name="author" placeholder="Autor" required>
            <label for="pageNumber">Número de Páginas</label>
            <input type="number" id="pageNumber" name="pageNumber" placeholder="123" required>
            <button id="confirmBtn" value="default">Confirm</button>
            <button type="button" id="close-btn" value="cancel">Cancel</button>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
