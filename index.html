<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p>Adicionar novo livro:</p>
    <button id="add-book-btn">Adicionar</button>
    <table>
        <thead>
            <tr>
                <th>id</th>
                <th>Name</th>
                <th>Autor</th>
                <th>Número de Páginas</th>
                <th>Lido</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <dialog id="add-book-dialog">
        <form id="myForm" novalidate>
            <div>
                <label for="bookName">
                    <span>Título</span>
                    <input type="text" id="bookName" name="bookName" placeholder="Título" required minlength="3"
                        maxlength="40" autocomplete="off">
                    <div><span class="error" aria-live="polite"></span></div>
                </label>
                <label for="author">
                    <span>Autor</span>
                    <input type="text" id="author" name="author" placeholder="Autor" required minlength="3"
                        maxlength="40" autocomplete="off">
                    <div><span class="error" aria-live="polite"></span></div>
                </label>
                <label for="pageNumber">
                    <span>Número de Páginas</span>
                    <input type="number" id="pageNumber" name="pageNumber" placeholder="123" required min="1"
                        max="10000" autocomplete="off">
                    <div><span class="error" aria-live="polite"></span></div>
                </label>
            </div>
            <div class="buttons">
                <button id="confirmBtn" value="default">Confirm</button>
                <button type="button" id="close-btn" value="cancel">Cancel</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
